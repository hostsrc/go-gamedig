name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22.x", stable]
        exclude:
          # Go 1.22 binaries lack LC_UUID, which current macOS dyld requires;
          # the minimum version is checked on Linux.
          - os: macos-latest
            go: "1.22.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # Every fuzz target runs for 30 s. One job per package keeps the wall
  # time of the slowest (four targets) near two and a half minutes.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/valve
            targets: FuzzQuery FuzzParse
          - pkg: ./internal/quake
            targets: FuzzQuery FuzzParse FuzzStripColors FuzzJSNumbers
          - pkg: ./internal/gamespy
            targets: FuzzQuery1 FuzzQuery2 FuzzQuery3 FuzzParse
          - pkg: ./internal/ase
            targets: FuzzQuery FuzzParse
          - pkg: ./internal/unreal2
            targets: FuzzQuery FuzzParse
          - pkg: ./internal/minecraft
            targets: FuzzVarint FuzzStatusPacket FuzzStatusJSON FuzzBedrock
          - pkg: ./internal/binreader
            targets: FuzzDecodeUTF8 FuzzDecodeWindows1252 FuzzDecodeUCS2
          - pkg: .
            targets: FuzzQuakeResultJSON
    name: fuzz ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: fuzz
        run: |
          for t in ${{ matrix.targets }}; do
            go test "${{ matrix.pkg }}" -run '^$' -fuzz "^$t\$" -fuzztime 30s
          done

  # Re-records every fixture with node-gamedig and fails if its output or
  # its requests differ from the committed ones.
  parity:
    runs-on: ubuntu-latest
    env:
      GAMEDIG_VERSION: 5.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g gamedig@${GAMEDIG_VERSION}
      - run: go run ./tools/fixture synth -gamedig-version ${GAMEDIG_VERSION} -out testdata
      - name: fixtures unchanged
        run: git diff --exit-code -- testdata
